name: Build & Release VirginERP Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Website_v2/package-lock.json

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        working-directory: ./Website_v2
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        working-directory: ./Website_v2
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAIA_API_KEY: ${{ secrets.VITE_MAIA_API_KEY }}
          VITE_AI_MODEL: ${{ secrets.VITE_AI_MODEL }}
          VITE_GLM_API_KEY: ${{ secrets.VITE_GLM_API_KEY }}
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER }}
          VITE_N8N_WEBHOOK_PROD_URL: ${{ secrets.VITE_N8N_WEBHOOK_PROD_URL }}
          VITE_N8N_WEBHOOK_TEST_URL: ${{ secrets.VITE_N8N_WEBHOOK_TEST_URL }}
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./Website_v2
        run: npx cap sync android

      - name: Configure google-services.json from Secret
        working-directory: ./Website_v2
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✔ google-services.json successfully configured from GitHub Secrets."
          else
            echo "ℹ GOOGLE_SERVICES_JSON secret is empty, skipping."
          fi

      - name: Build Android Debug APK with Gradle
        working-directory: ./Website_v2/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload VirginERP APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirginERP-APK-latest
          path: Website_v2/android/app/build/outputs/apk/debug/app-debug.apk
